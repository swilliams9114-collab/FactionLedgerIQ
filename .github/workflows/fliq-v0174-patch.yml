name: FactionLedgerIQ v0.17.4 one-time patch

on:
  push:
    branches:
      - v0.17.4-dashboard-controls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: v0.17.4-dashboard-controls

      - name: Patch FactionLedgerIQ
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('FactionLedgerIQ.user.js')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once('// @version      0.17.3', '// @version      0.17.4', 'userscript version')
          replace_once("const VERSION = '0.17.3';", "const VERSION = '0.17.4';", 'runtime version')
          replace_once("    let receiptFilter = 'open';\n", "    let receiptFilter = 'open';\n    let dashboardTestResultVisible = false;\n", 'dashboard test visibility state')
          replace_once(
              "    async function pollApiLogs(showToast) {\n        if (apiPollBusy || !state.settings.apiPolling || !apiKeyValue()) return;",
              "    async function pollApiLogs(showToast, force) {\n        if (apiPollBusy || (!force && !state.settings.apiPolling) || !apiKeyValue()) return;",
              'manual sync force support'
          )

          quick_record = "        '<div class=\"fliq-section\"><h3>Quick Record</h3>' + eventForm() + '</div>' +"
          dashboard_tools = (
              "        '<div class=\"fliq-section\"><h3>Dashboard Tools</h3><div class=\"fliq-card\">' +\n"
              "            '<div class=\"fliq-actions\" style=\"margin-top:0\">' +\n"
              "                '<button class=\"fliq-btn fliq-btn-primary\" type=\"button\" data-fliq=\"sync-now\">Sync Now</button>' +\n"
              "                '<button class=\"fliq-btn\" type=\"button\" data-fliq=\"run-full-system-test\">Run Full System Test</button>' +\n"
              "            '</div>' +\n"
              "            '<div class=\"fliq-muted\" data-fliq-api-status style=\"margin-top:8px\">API status: ' + esc(state.detection.apiStatus || 'Not configured') +\n"
              "                (state.detection.lastApiPollAt ? ' · Last check ' + esc(new Date(state.detection.lastApiPollAt).toLocaleTimeString()) : '') +\n"
              "                (state.detection.lastApiError ? '<br>Error: ' + esc(state.detection.lastApiError) : '') + '</div>' +\n"
              "            '<div class=\"fliq-muted\" style=\"margin-top:4px\">Sync Now uses the same Torn API reconciliation as automatic polling and can be used even when automatic polling is off.</div>' +\n"
              "        '</div></div>' +\n"
              "        (dashboardTestResultVisible ? '<div class=\"fliq-section\"><h3>Full-System Test Results</h3>' + renderFullSystemAudit() + '</div>' : '') +\n"
          )
          replace_once(quick_record, dashboard_tools + quick_record, 'dashboard tools')

          close_marker = (
              "        if (action === 'close') {\n"
              "            togglePanel(false);\n"
              "            return;\n"
              "        }\n\n"
              "        if (action === 'toggle-profit-loss-breakdown') {"
          )
          control_handlers = (
              "        if (action === 'close') {\n"
              "            togglePanel(false);\n"
              "            return;\n"
              "        }\n\n"
              "        if (action === 'sync-now') {\n"
              "            if (!apiKeyValue()) {\n"
              "                toast('Add Torn API key in Settings first');\n"
              "                return;\n"
              "            }\n"
              "            if (apiPollBusy) {\n"
              "                toast('Sync already running');\n"
              "                return;\n"
              "            }\n"
              "            btn.disabled = true;\n"
              "            btn.textContent = 'Syncing…';\n"
              "            pollApiLogs(true, true).finally(function () {\n"
              "                const current = document.querySelector('[data-fliq=\"sync-now\"]');\n"
              "                if (current) {\n"
              "                    current.disabled = false;\n"
              "                    current.textContent = 'Sync Now';\n"
              "                }\n"
              "            });\n"
              "            return;\n"
              "        }\n\n"
              "        if (action === 'run-full-system-test') {\n"
              "            dashboardTestResultVisible = true;\n"
              "            render();\n"
              "            toast('Full-system test complete');\n"
              "            return;\n"
              "        }\n\n"
              "        if (action === 'toggle-profit-loss-breakdown') {"
          )
          replace_once(close_marker, control_handlers, 'dashboard click handlers')

          old_test_actions = "            '<div class=\"fliq-actions\"><button class=\"fliq-btn\" type=\"button\" data-fliq=\"copy-full-test-report\">Copy Full Test Report</button></div></div>';"
          new_test_actions = "            '<div class=\"fliq-actions\"><button class=\"fliq-btn fliq-btn-primary\" type=\"button\" data-fliq=\"run-full-system-test\">Run Full System Test</button><button class=\"fliq-btn\" type=\"button\" data-fliq=\"copy-full-test-report\">Copy Full Test Report</button></div></div>';"
          replace_once(old_test_actions, new_test_actions, 'full-system test controls')

          path.write_text(s, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          required = [
              "// @version      0.17.4",
              "const VERSION = '0.17.4';",
              'data-fliq="sync-now"',
              'data-fliq="run-full-system-test"',
              'pollApiLogs(true, true)',
              "function reimbursementCalculation(tx)",
              "function repairShadowedRecentPurchaseDepositsV0173()"
          ]
          missing = [x for x in required if x not in updated]
          if missing:
              raise SystemExit('Missing required markers: ' + repr(missing))
          PY

      - name: JavaScript syntax check
        run: node --check FactionLedgerIQ.user.js

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/fliq-v0174-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js .github/workflows/fliq-v0174-patch.yml
          git commit -m "v0.17.4 add Dashboard Sync Now and Full System Test controls"
          git push origin HEAD:v0.17.4-dashboard-controls
