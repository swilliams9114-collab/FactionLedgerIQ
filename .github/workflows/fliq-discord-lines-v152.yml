name: FLIQ Discord lines v1.5.2
on: [push]
jobs:
  apply:
    if: github.event.head_commit.message == 'Run v1.5.2 Discord line patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_discord_lines_v152.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'FactionLedgerIQ v1.5.2 Discord reimbursement lines'
          file_pattern: 'FactionLedgerIQ.user.js'
