name: FLIQ personal ledger v1.5.0
on: [push]
jobs:
  apply:
    if: github.event.head_commit.message == 'Run v1.5.0 personal ledger patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_personal_ledger_v150.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'FactionLedgerIQ v1.5.0 personal ledger simplification'
          file_pattern: 'FactionLedgerIQ.user.js'
