name: FLIQ unknown ownership v1.2.2
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run FactionLedgerIQ unknown ownership patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_unknown_ownership_v122.py
      - run: node --check FactionLedgerIQ.user.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js
          git commit -m "Stop inferred ownership reimbursements" || exit 0
          git push
