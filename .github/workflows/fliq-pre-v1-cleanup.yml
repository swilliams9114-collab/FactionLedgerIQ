name: FLIQ pre-V1 cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_pre_v1_cleanup.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: EndBug/add-and-commit@v9
        with:
          add: FactionLedgerIQ.user.js
          message: Archive pre-V1 Armory records after receipt generation
