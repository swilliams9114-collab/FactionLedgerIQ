name: FLIQ Diagnostics v1.2.7
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run FactionLedgerIQ diagnostics patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_diagnostics_v127.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add LedgerIQ diagnostics health check
          file_pattern: FactionLedgerIQ.user.js
