name: FLIQ Display baseline v1.2.11
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run FactionLedgerIQ Display baseline patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_display_baseline_v1211.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix Display Case baseline reconciliation
          file_pattern: FactionLedgerIQ.user.js
# trigger
