name: Promote FactionLedgerIQ V1

on:
  push:
    branches:
      - main

jobs:
  promote:
    if: github.event.head_commit.message == 'Temporarily promote FactionLedgerIQ V1 to live userscript'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Promote V1 to live file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('FactionLedgerIQ.v1.user.js').read_text()
          src = src.replace('// @name         FactionLedgerIQ V1', '// @name         FactionLedgerIQ', 1)
          src = src.replace('// @version      1.0.0-alpha.1', '// @version      1.0.0', 1)
          src = src.replace("const VERSION='1.0.0-alpha.1';", "const VERSION='1.0.0';", 1)
          Path('FactionLedgerIQ.user.js').write_text(src)
          Path('FactionLedgerIQ.v1.user.js').unlink()
          Path('.github/workflows/fliq-v1-promote.yml').unlink()
          PY
          node --check FactionLedgerIQ.user.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Promote FactionLedgerIQ 1.0.0 rebuild to main"
          git push origin main
