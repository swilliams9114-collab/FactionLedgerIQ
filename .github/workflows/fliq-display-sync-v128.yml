name: FLIQ Display sync v1.2.8
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run FactionLedgerIQ Display sync patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_display_sync_v128.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add automatic Display Case reconciliation
          file_pattern: FactionLedgerIQ.user.js
