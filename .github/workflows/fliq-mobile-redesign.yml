name: Apply FLIQ mobile redesign
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply FactionLedgerIQ mobile redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_mobile_redesign.py
      - run: |
          node --check FactionLedgerIQ.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js
          git commit -m "Redesign LedgerIQ mobile layout" || exit 0
          git push
