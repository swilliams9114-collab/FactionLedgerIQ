name: FactionLedgerIQ v0.17.5 one-time patch

on:
  push:
    branches:
      - v0.17.5-armory-return-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: v0.17.5-armory-return-order

      - name: Patch FactionLedgerIQ
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fliq_v0175_patch.py
          python3 /tmp/fliq_v0175_patch.py

      - name: JavaScript syntax check
        run: node --check FactionLedgerIQ.user.js

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/fliq-v0175-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js .github/workflows/fliq-v0175-patch.yml
          git commit -m "v0.17.5 fix faction Armory return ordering and repair false reimbursement"
          git push origin HEAD:v0.17.5-armory-return-order
