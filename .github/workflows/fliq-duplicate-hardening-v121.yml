name: FLIQ duplicate hardening v1.2.1
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run FactionLedgerIQ duplicate hardening patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_duplicate_hardening_v121.py
      - run: node --check FactionLedgerIQ.user.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js
          git commit -m "Harden duplicate processing and reimbursement imports" || exit 0
          git push
