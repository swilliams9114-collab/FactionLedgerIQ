name: Apply FLIQ manual approval
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_manual_audit_approval.py
      - run: node --check FactionLedgerIQ.user.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add FactionLedgerIQ.user.js
          git commit -m "Add manual audit approval" || exit 0
          git push
