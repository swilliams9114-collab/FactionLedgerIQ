name: Temporary FLIQ Storage Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch storage handling
        run: python3 tools/patch_storage.py
      - name: Syntax check
        run: node --check FactionLedgerIQ.user.js
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FactionLedgerIQ.user.js
          git commit -m "Fix TornPDA storage quota handling"
          git push
