name: FLIQ receipt history v1.4.2
on: [push]
jobs:
  apply:
    if: github.event.head_commit.message == 'Run receipt history v1.4.2 patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_receipt_history_v142.py
      - run: node --check FactionLedgerIQ.user.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'FactionLedgerIQ v1.4.2 receipt history and compact audit payloads'
          file_pattern: 'FactionLedgerIQ.user.js'
